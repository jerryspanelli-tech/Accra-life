function radioStop(){clearInterval(rt);rt=null}
function radioStart(){radioStop();if(!ac){const C0=window.AudioContext||window.webkitAudioContext;if(!C0){radioOn=false;return toast('Audio not supported here')}ac=new C0();rg0=ac.createGain();rg0.gain.value=radioVol*.5;rg0.connect(ac.destination)}if(ac.state=='suspended')ac.resume();

function tone(t,f,type,dur,vol){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(rg0);o.start(t);o.stop(t+dur+.02);return o}
function hat(t){if(!nb){nb=ac.createBuffer(1,2205,44100);const d=nb.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=Math.random()*2-1}const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;s.buffer=nb;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(rg0);s.start(t)}
function rbeat(t,i,st){const k=i%16,sc=[[392,440,523,587,659,784],[330,392,440,494,587,659],[262,330,392,440,523,659]][radioSt];if(k==0||k==6||k==10){const o=tone(t,140,'sine',.18,.9);o.frequency.exponentialRampToValueAtTime(40,t+.15)}if(k%4==2)hat(t);if(k==0||k==8||k==12)tone(t,[98,110,87,98][(i>>4)%4],'sine',st*3,.6);if([0,3,5,7,10,12,14,15].includes(k))tone(t,sc[(i*3+(i>>3))%sc.length],'triangle',.22,.25)}

async function ownerLog(action,detail){if(!DBX)return;try{await DBX.collection('logs').doc(Date.now().toString(36)+Math.random().toString(36).slice(2,6)).set({action,detail:String(detail||'').slice(0,300),by:ME_ID||'owner',at:Date.now()})}catch(e){}}
async function ownerGrant(uid,delta,reason,mode,value){if(!DBX)throw new Error('The owner database is not connected.');if(!uid||!reason)throw new Error('Player and reason are required.');
 const id=uid.slice(0,40)+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 const body={uid,mode:mode||'delta',reason:String(reason).slice(0,120),by:ME_ID||'owner',at:Date.now()};
 if(body.mode=='set')body.value=Math.max(0,Math.round(Number(value)||0));else body.delta=Math.round(delta);
 await DBX.collection('adjustments').doc(id).set(body);
 await ownerLog('money',uid+' '+(body.mode=='set'?'set to '+body.value:(body.delta>=0?'+':'')+body.delta)+' — '+reason);if(ROOMX)ROOMX.emit('grant',{id}).catch(()=>{});return id}
