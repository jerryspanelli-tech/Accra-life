name: Validate Accra Life
on:
  pull_request:
  push:
    branches: [main, "fix/**", "feat/**"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run test:server
      - run: npx wrangler deploy --dry-run
