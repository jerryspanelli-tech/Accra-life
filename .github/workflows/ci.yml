name: Accra Life CI

on:
  push:
    branches:
      - main
      - redesign/greater-accra-landmarks
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run syntax and Accra map tests
        run: npm test
      - name: Run server and multiplayer smoke test
        run: npm run test:server
